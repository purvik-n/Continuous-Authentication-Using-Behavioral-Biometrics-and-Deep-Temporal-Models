version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustloop-backend
    ports:
      - "8000:8000"
    environment:
      - FRONTEND_URL=http://localhost:5173
      - API_RATE_LIMIT_PER_MINUTE=120
    env_file:
      - ./backend/.env.example
    volumes:
      - backend-db:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustloop-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-db:
